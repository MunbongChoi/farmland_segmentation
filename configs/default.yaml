_base_: [dataset.yaml, model.yaml]

project:
  name: farmland_segformer_b4
  seed: 42
  output_dir: outputs/segformer_b4

training:
  epochs: 100
  batch_size: 8
  validation_batch_size: 8
  num_workers: 4
  learning_rate: 0.0001
  weight_decay: 0.0001
  mixed_precision: true
  gradient_accumulation_steps: 1
  gradient_clip_norm: 1.0
  early_stopping_patience: 15
  monitor: mean_iou_no_background
  scheduler: cosine
  min_learning_rate: 0.000001
  pin_memory: true
  persistent_workers: true
  # 실수로 torchrun CPU 다중 프로세스를 실행하는 것을 방지한다.
  allow_cpu_ddp: false
  resume: null

evaluation:
  include_background: true

inference:
  tile_size: 512
  overlap: 128
  # OOM 시 auto_reduce_batch가 절반씩 자동으로 줄이므로 크게 잡아도 안전하다.
  batch_size: 32
  # 모델 학습 기준과 동일한 25cm/pixel 격자에서 추론한다.
  target_resolution_m: 0.25
  # 원본이 투영 CRS이면 null로 두어 유지한다. 경위도 입력은 EPSG:5179 등을 지정한다.
  target_crs: null
  resampling: bilinear
  # 25cm 확대에 따른 과도한 메모리/출력을 막는다. 0이면 제한하지 않는다.
  max_resampled_pixels: 100000000
  merge: hann
  auto_reduce_batch: true
  require_georeference: true
  confidence_threshold: 0.5
  # watershed 경계 닫기 튜닝. 병합(필지 합쳐짐)이 심하면 seed_erosion을 1~2로,
  # seed_boundary_maximum을 0.08 근처로 낮춰 씨앗을 더 엄격하게 분리한다.
  watershed_seed_threshold: 0.5
  watershed_seed_boundary_maximum: 0.15
  watershed_line_iterations: 1
  watershed_seed_erosion_iterations: 1
  # 경계 클래스를 산출물에서 제거: 경계 픽셀을 이웃 필지로 흡수시켜 필지가 맞닿게 한다.
  erase_boundary: true
  # 구름 지역 예측 제거: 전 밴드가 밝은 큰 덩어리를 구름으로 보고 마스크/폴리곤을 비운다.
  cloud_mask: false
  cloud_min_brightness: 200.0   # 0~255 (2~98% 스트레치 기준). 얇은 구름까지 잡으려면 낮춘다
  cloud_min_area_m2: 10000.0    # 이보다 작은 밝은 덩어리(비닐하우스 지붕 등)는 구름으로 안 봄
  cloud_dilate_m: 20.0          # 구름 가장자리 여유 폭

postprocess:
  enabled: true
  min_area: {1: 100.0, 2: 100.0}
  min_area_unit: m2
  fill_holes: true
  opening_iterations: 0
  closing_iterations: 1
  boundary_smoothing_iterations: 1
  boundary_erosion_pixels: 1
  save_instances: true

output:
  save_probability_map: true
  save_raw_mask: true
  save_postprocessed_mask: true
  save_vector: true
  # 서브픽셀 평활: 가우시안 sigma(px) 후 marching squares 등고선 폴리곤화 — 계단 자체를 없앤다.
  vector_smooth_px: 1.5
  # 벡터 외곽선 Douglas-Peucker 단순화 허용 오차(m). 평활 후 꼭짓점 수 절감용.
  vector_simplify_m: 0.5

logging:
  wandb: false
  wandb_project: farmland-segmentation
