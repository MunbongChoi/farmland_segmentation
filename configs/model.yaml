model:
  name: segformer
  input_channels: 3
  num_classes: 3
  checkpoint: nvidia/segformer-b2-finetuned-ade-512-512
  # Official Safetensors conversion commit; avoids unsafe torch.load on torch 2.5.
  revision: 4585665b1bf59b90b831d5145d3e25d6e0743d03
  use_safetensors: true
  pretrained: true
  local_files_only: false
  gradient_checkpointing: false
  # U-Net으로 되돌릴 때 사용하는 설정
  base_channels: 32
  bilinear: true

loss:
  weights:
    cross_entropy: 1.0
    binary_cross_entropy: 0.0
    dice: 1.0
    focal: 0.0
    tversky: 0.0
    boundary: 0.1
  class_weights: null
  focal_gamma: 2.0
  tversky_alpha: 0.3
  tversky_beta: 0.7
