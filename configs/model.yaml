model:
  name: segformer
  input_channels: 3
  num_classes: 3
  # TensorFlow/Keras SegFormer-B4 ADE20K weights. The 150-class head is replaced.
  checkpoint: b4.h5
  h5_architecture: b4
  revision: null
  use_safetensors: true
  pretrained: true
  local_files_only: false
  gradient_checkpointing: false
  # U-Net으로 되돌릴 때 사용하는 설정
  base_channels: 32
  bilinear: true

loss:
  weights:
    cross_entropy: 1.0
    binary_cross_entropy: 0.0
    dice: 1.0
    focal: 0.0
    tversky: 0.0
    boundary: 0.1
  class_weights: null
  focal_gamma: 2.0
  tversky_alpha: 0.3
  tversky_beta: 0.7
