# 사전 타일링된 데이터셋(images/labels TIF 쌍 + manifest.csv split) 학습 설정.
# 학습/모델/손실 설정은 default.yaml을 그대로 상속한다.
_base_: [default.yaml]

project:
  name: farmland_tiles_segformer_b4
  output_dir: outputs/tiles_segformer_b4

training:
  epochs: 200

inference:
  # 이 데이터셋은 0.5m GSD로 학습하므로 default의 0.25m 격자를 쓰지 않는다.
  target_resolution_m: 0.5
  # 장면 모자이크는 ~9억 픽셀이므로 상한을 해제한다.
  max_resampled_pixels: 0
  # 경계 확률 watershed로 끊긴 필지 경계를 닫아 인접 필지가 붙지 않게 한다.
  close_boundaries: true

dataset:
  type: tiles
  root_dir: "../data/farmmap"
  input_channels: 3
  # 밴드 순서: red, green, blue, nir — 사전학습 SegFormer는 RGB 3채널만 사용한다.
  channel_indices: [1, 2, 3]
  tile_size: 512
  ignore_index: 255
  num_classes: 3
  class_names: ["배경", "필지 내부", "필지 경계"]
  # train split 1,000타일 표본에서 계산한 실제 데이터 통계 (R, G, B).
  # ImageNet 통계 대신 데이터셋 통계로 통일한다 — NIR 실험과의 공정 비교 목적.
  mean: [0.4972, 0.5108, 0.4637]
  std: [0.2773, 0.2594, 0.2635]
